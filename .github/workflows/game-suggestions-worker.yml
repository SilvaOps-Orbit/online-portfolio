name: Deploy Game Suggestions Worker

on:
  push:
    branches:
      - main
    paths:
      - "game-suggestions-worker/**"
      - "scripts/update-steam-wishlist.mjs"
      - ".github/workflows/game-suggestions-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-suggestions-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check deployment readiness
        id: readiness
        shell: bash
        env:
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN2 }}
          CLOUDFLARE_WORKER_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if test -n "$CLOUDFLARE_D1_API_TOKEN" && test -n "$CLOUDFLARE_WORKER_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Game suggestion deployment skipped. Add both Cloudflare API tokens and CLOUDFLARE_ACCOUNT_ID."
          fi

      - name: Check Worker JavaScript
        if: steps.readiness.outputs.ready == 'true'
        run: node --check game-suggestions-worker/src/index.js

      - name: Provision D1 and deploy Worker
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        env:
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN2 }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WISHLIST_SYNC_TOKEN: ${{ secrets.WISHLIST_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          list_json=$(env CLOUDFLARE_API_TOKEN="$CLOUDFLARE_D1_API_TOKEN" npx --yes wrangler@4 d1 list --json)
          database_id=$(printf '%s' "$list_json" | jq -r '(if type == "array" then . else (.result // []) end)[] | select(.name == "echoops-game-suggestions") | .uuid' | head -n 1)
          if test -z "$database_id"; then
            env CLOUDFLARE_API_TOKEN="$CLOUDFLARE_D1_API_TOKEN" npx --yes wrangler@4 d1 create echoops-game-suggestions --location oc
            list_json=$(env CLOUDFLARE_API_TOKEN="$CLOUDFLARE_D1_API_TOKEN" npx --yes wrangler@4 d1 list --json)
            database_id=$(printf '%s' "$list_json" | jq -r '(if type == "array" then . else (.result // []) end)[] | select(.name == "echoops-game-suggestions") | .uuid' | head -n 1)
          fi
          test -n "$database_id" && test "$database_id" != "null"
          sed "s/00000000-0000-0000-0000-000000000000/$database_id/" wrangler.jsonc > wrangler.deploy.jsonc
          env CLOUDFLARE_API_TOKEN="$CLOUDFLARE_D1_API_TOKEN" npx --yes wrangler@4 d1 execute echoops-game-suggestions --remote --file schema.sql --config wrangler.deploy.jsonc
          npx --yes wrangler@4 deploy --config wrangler.deploy.jsonc
          if test -n "$WISHLIST_SYNC_TOKEN"; then
            printf '%s' "$WISHLIST_SYNC_TOKEN" | npx --yes wrangler@4 secret put WISHLIST_SYNC_TOKEN --config wrangler.deploy.jsonc
          else
            echo "::warning::Add WISHLIST_SYNC_TOKEN to repository secrets to enable trusted wishlist imports."
          fi
        working-directory: game-suggestions-worker

      - name: Resync wishlist prices and genres
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: "76561199192411740"
          STEAM_WISHLIST_URL: "https://store.steampowered.com/wishlist/profiles/76561199192411740/?st=9730497737884137652"
          GAME_SUGGESTION_ENDPOINT: "https://echoops-game-suggestions.alvis-dev.workers.dev"
          WISHLIST_SYNC_TOKEN: ${{ secrets.WISHLIST_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$STEAM_API_KEY" || { echo "::error::Add STEAM_API_KEY to repository secrets."; exit 1; }
          test -n "$WISHLIST_SYNC_TOKEN" || { echo "::error::Add WISHLIST_SYNC_TOKEN to repository secrets."; exit 1; }
          node scripts/update-steam-wishlist.mjs
