name: Refresh Market and News Data

on:
  # Legacy manual fallback. refresh-data.yml owns scheduled publishing.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Set up Python for yfinance
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install market data tools
        run: python -m pip install "yfinance>=0.2.66,<2"

      - name: Preserve deployed dynamic data
        run: node scripts/preserve-deployed-data.mjs
        env:
          PRESERVE_DATA_BASE_URL: "https://silvaops-orbit.github.io/online-portfolio"
          PRESERVE_DATA_FILES: "steam.json,steam-wishlist.json,spotify.json,market.json,news.json,github.json,api-status.json,youtube.json"

      - name: Generate market and news data
        run: node scripts/update-market-news-data.mjs
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          MEDIASTACK_API_KEY: ${{ secrets.MEDIASTACK_API_KEY }}
          MEDIASTACK_ACCESS_KEY: ${{ secrets.MEDIASTACK_ACCESS_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
